# 国内 NTP 源。由 scripts/core/system-services.sh 部署到
# /etc/systemd/timesyncd.conf.d/60-cn-ntp.conf（root 拥有；仓库拥有 = 每次 install 覆盖）。
#
# 为什么是 drop-in 而不是改 /etc/systemd/timesyncd.conf：主文件里发行版默认的
# FallbackNTP（arch pool 四台）留着兜底 —— timesyncd 只在 NTP= 这一组全都不可达时
# 才用它。改主文件等于把那份兜底连注释一起抄一遍，发行版更新时还会冲突。
#
# 为什么前缀是 60-：systemd 的约定是 /etc 下的 drop-in 用 60-90 段，10-40 留给
# 发行版写 /usr（见 man timesyncd.conf，「drop-in priorities」那节）。
#
# 三台都是本机实测可达的（2026-10-12，各三次查询、校验服务器回显了我们发出去的时间
# 戳才收）：腾讯 106.55.184.199、cn.pool 193.182.111.141 / 162.159.200.1、阿里
# 203.107.6.88，与本机时钟一致到 0.005~0.14 s。顺序没有强弱之分，挑三个不同运营商
# 的域名只是为了互相兜底。
[Time]
NTP=time1.cloud.tencent.com cn.pool.ntp.org ntp.aliyun.com
