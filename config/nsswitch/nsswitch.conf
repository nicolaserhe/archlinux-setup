# 部署目标：/etc/nsswitch.conf（scripts/core/system-services.sh，root 所有）
# hosts 行在 Arch 默认基础上加了 mdns_minimal [NOTFOUND=return]：Linux 本机用
# avahi 解析 .local 名字（archlinux.local / win.local）。.local 保留给 mDNS，
# 查不到就不回退 DNS，避免拖慢普通解析。
#
# Name Service Switch configuration file.
# See nsswitch.conf(5) for details.

passwd: files systemd
group: files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

publickey: files

hosts: mymachines mdns_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
