<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 把 Noto Color Emoji 放进 generic family 的 weak 档（emoji 码位才有意义，
       别抢 Latin 的主字体）。

       这里原先写的是 `binding="strong"`，实测有害：strong 档排在 lang 之前，
       于是 emoji 变成**每个** generic 查询的首选字体 —— 隔离的 fontconfig 链上
       `fc-match sans-serif` 直接给 NotoColorEmoji.ttf（探针见
       docs/quirks/input-and-fonts.md）。
       换成 weak 后 `fc-match sans-serif` 回到 Noto Sans，而 😀 仍然给
       NotoColorEmoji.ttf（两种写法在纯系统配置下也一样，见下）。

       也就是说这条规则在**本机**其实是防御性的：不装本文件，`fc-match
       'sans-serif:charset=1f600'` 与 `:charset=2764` 同样命中 Noto Color Emoji
       （Noto Sans CJK 并不覆盖这些码位，不存在"CJK 单色 emoji 抢色字"的情况；
       U+2600 ☀ 落到 CJK 是 Unicode 的 text-default 语义，正确）。留着它是为了
       字体集合不同的机器上 emoji 仍排在 CJK 回退之前，weak 档足够做到这点。 -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
