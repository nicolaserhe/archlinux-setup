<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 目的：中文（汉字）落在 **Noto Sans/Serif/Mono CJK SC** 上，
       而不是落进同族里的 TC / JP / KR 变体，也不要落进 Maple Mono。

       fontconfig 的 family 列表分两档：strong 与 weak。strong 档在看 lang 之前
       生效，weak 档在看 lang 之后才轮到（见 fonts-conf(5)）。下面两块分别处理
       "应用声明了语言" 和 "没声明语言" 两种查询。 -->

  <!-- 1) 查询里带 lang=zh*（LANG=zh_CN.UTF-8，或应用自己传 lang）：直接把 SC
         顶到最前。测过：没有这块时 `fc-match 'sans-serif:lang=zh-cn'` 给的是
         Noto Sans CJK **KR**（系统 65-nonlatin.conf 的 prefer 列表里 KR 排在
         前面），所以这块是真正在干活的那块。 -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- 2) 查询里没有 lang=zh（LANG=en_US.UTF-8 的桌面，应用也不传 lang）：仍然要
        让 SC 排在其它 CJK 变体前面，但**必须排在 Latin 字体之后**。

        这里原先写的是 `mode="append" binding="weak"` —— 测下来是**无效的**：
        实测 `fc-match 'sans-serif:charset=4f60'`（"你"）仍然给 Noto Sans CJK
        **KR**。weak 档排在所有 strong 项之后，而 Latin 字体（60-latin.conf）和
        CJK 变体（65-nonlatin.conf）都是以 strong 档插进来的，所以 SC 被 append
        到了最末尾，轮不到它。

        用 `<alias><prefer>`（= `mode="prepend" binding="same"`，插在匹配到的
        `sans-serif` 之前）才落到正确的槽位：这些 prefer 项按配置文件加载顺序
        依次插在 generic 名字之前，本文件（65-cjk-sc.conf）排在 60-latin.conf
        之后、65-nonlatin.conf 之前 —— 于是顺序正好是
        Latin(60-latin) → SC(本文件) → TC/JP/KR(65-nonlatin)。 -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
</fontconfig>
