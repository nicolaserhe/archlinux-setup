# 部署目标：/etc/samba/smb.conf（scripts/core/samba.sh，root 所有）
# %H/%U 按连接用户解析，避免写死用户名。

[global]
   server string = archlinux
   server role = standalone server
   hosts allow = 192.168.1.0/24 127.0.0.1
   log file = /var/log/samba/%m.log
   max log size = 50
   socket options = TCP_NODELAY IPTOS_LOWDELAY

[Shared]
   path = %H/Shared
   browseable = yes
   writable = yes
   valid users = %U
   strict sync = yes
   sync always = yes
   oplocks = no
   level2 oplocks = no
   kernel oplocks = no
