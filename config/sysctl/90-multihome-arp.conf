# 部署目标：/etc/sysctl.d/90-multihome-arp.conf（scripts/core/system-services.sh，root 所有）
#
# 双网卡同网段（enp11s0 + wlp12s0 都在 192.168.3.0/24）时，Linux 默认会从任意
# 网卡应答 ARP。NetworkManager 的 ACD（地址冲突检测）会把本机另一张网卡的应答
# 误判成"IP 冲突"，把刚通过 DHCP 拿到的地址 decline 掉、连默认路由一起撤掉。
#
# arp_ignore=1：只回答与本接口地址匹配的 ARP 请求。
# arp_announce=2：发 ARP 时始终用本接口自己的源地址，不泄漏其他网卡的地址。
# 多网卡主机的标准配置；单网卡机器上也无副作用。
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
