# 部署目标：~/.config/mousehop/config.toml（scripts/core/mousehop.sh，仅首次播种）
#
# 对端只用 hostname 走 mDNS 发现，不写死 IP。授权指纹
# （authorized_fingerprints）和 last_addr 由 Mousehop 运行时写入本机这份文件，
# 属于机器私有状态，仓库不保存、也不覆盖。
port = 4252

[[clients]]
position = "right"
hostname = "win"
activate_on_startup = true
# 防止光标碰到右边缘就抢键盘（抢走时本地 fcitx5 失焦、打不了字）。
# 按住 Ctrl 推向该边缘才 handover；不要用 super：Mousehop 会把按住的修饰键
# 原样转发给 Windows，Win 键会弹开始菜单（command_as_ctrl 在 Linux 发送端
# 被强制关闭，挡不住）。
require_crossing_modifier = true
crossing_modifier = "control"
