# 部署目标：~/.config/mousehop/config.toml（scripts/core/mousehop.sh，仅首次播种）
#
# 对端只用 hostname 走 mDNS 发现，不写死 IP。授权指纹
# （authorized_fingerprints）和 last_addr 由 Mousehop 运行时写入本机这份文件，
# 属于机器私有状态，仓库不保存、也不覆盖。
port = 4252

[[clients]]
position = "right"
hostname = "win"
activate_on_startup = true
# 防止光标碰到右边缘就抢键盘（抢走时本地 fcitx5 失焦、打不了字）。
# 按住 Alt 推向该边缘才 handover。不要用 control：Ctrl+Space 是切中文的键，
# 光标停在右边缘时按它会被门控当成跨界请求，键盘直接被送到 Windows
# （2026-11-10 实测）。不要用 super：Mousehop 会把按住的修饰键原样转发给
# Windows，Win 键会弹开始菜单（command_as_ctrl 在 Linux 发送端被强制关闭，
# 挡不住）。
require_crossing_modifier = true
crossing_modifier = "alt"
# 剪切板共享（文本）：发端是这里的 clipboard_send，收端是授权指纹条目里的
# clipboard_receive，两边都为 true 才会传输，默认都是 false。接收端字段按
# 指纹存放（机器私有状态），仓库不播种，配对后在 GUI 里打开。
clipboard_send = true
